<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Dealerfocus Training Academy</title>
<link rel="stylesheet" href="style.css"><script src="auth.js"></script>
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:1200px;margin:0 auto;padding:84px 20px 40px;box-sizing:border-box}
.auth-title{margin:0 0 28px;text-align:center;font-family:'Poppins',Arial,Helvetica,sans-serif;font-weight:800;font-size:clamp(26px,4.4vw,52px);line-height:1.15;letter-spacing:.03em;text-transform:uppercase;color:#050141}
.s-wrap{position:relative;display:inline-block}
.grad-cap{position:absolute;left:50%;bottom:60%;width:1.5em;height:auto;pointer-events:none;overflow:visible;transform-origin:50% 100%;transform:translate(-50%,0) rotate(-6deg);animation:cap-pop 3.4s cubic-bezier(.3,.7,.4,1) .7s both}
.cap-tassel{transform-box:fill-box;transform-origin:50% 0;animation:tassel-swing 1.6s ease-in-out 3.3s 3}
@keyframes cap-pop{
  0%{transform:translate(-50%,115%) scale(.15) rotate(-35deg);opacity:0}
  10%{opacity:1}
  42%{transform:translate(-8%,-115%) scale(1.15) rotate(24deg);opacity:1}
  66%{transform:translate(-50%,-12%) scale(1) rotate(-12deg)}
  76%{transform:translate(-50%,-34%) scale(1) rotate(3deg)}
  88%{transform:translate(-50%,3%) scale(1) rotate(-8deg)}
  100%{transform:translate(-50%,0) scale(1) rotate(-6deg);opacity:1}
}
@keyframes tassel-swing{0%,100%{transform:rotate(0)}30%{transform:rotate(14deg)}70%{transform:rotate(-10deg)}}
@media (prefers-reduced-motion:reduce){.grad-cap,.cap-tassel{animation:none}}
.auth-card{width:100%;max-width:460px}
.auth-logo{display:flex;justify-content:center;margin-bottom:18px}
.auth-logo img{height:72px;width:auto;margin:0 auto}
.auth-card h2,.auth-card p.sub{text-align:center}
.site-footer{justify-content:center;text-align:center}
.auth-card{background:#fff;border:1px solid #dfe4ee;border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(10,30,70,.08)}
.auth-card h2{margin:0 0 6px;font-size:24px;color:#050141}
.auth-card p.sub{margin:0 0 18px;color:#667085;font-size:14px}
.auth-card label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#050141}
.auth-card input{width:100%;padding:11px 12px;border:1px solid #cfd7e5;border-radius:9px;font-size:15px;box-sizing:border-box}
.auth-card button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;background:#050141;color:#fff;font-weight:800;cursor:pointer;font-size:15px}
.auth-card button.sec{background:#e9eef8;color:#050141}
.auth-err{background:#fde4e4;color:#a61e2a;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}
.auth-ok{background:#dff6e9;color:#11663d;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;padding:10px;border-radius:9px;border:1px solid #dfe4ee;background:#f4f6fb;cursor:pointer;font-weight:700}
.tabs button.on{background:#050141;color:#fff;border-color:#050141}
.demo{font-size:12.5px;color:#667085;background:#f4f7fb;border-radius:9px;padding:10px 12px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<main class="auth-wrap">
<h1 class="auth-title">Dealerfocu<span class="s-wrap">s<svg class="grad-cap" viewBox="0 0 120 84" aria-hidden="true" focusable="false"><path d="M26 40v20c0 9 15 15 34 15s34-6 34-15V40L60 54z" fill="#1d1d7a"/><path d="M26 40l34 14 34-14" fill="none" stroke="#050141" stroke-width="2"/><polygon points="60,4 119,27 60,50 1,27" fill="#050141" stroke="#00eeff" stroke-width="2.5" stroke-linejoin="round"/><circle cx="60" cy="27" r="3.4" fill="#00eeff"/><g class="cap-tassel"><path d="M60 27 L103 36 V63" fill="none" stroke="#f5b301" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 61h10l2 17H96z" fill="#f5b301"/></g></svg></span><br>Training Academy</h1>
<div class="auth-card">
<div class="auth-logo"><img src="assets/logo-dealerfocus.png" alt="Dealerfocus Training Academy logo"></div>
<h2 class="sec-headings">Welcome Trainees</h2>
<p class="sub">Login to your portal</p>
<div id="fLogin">
<label>Email</label><input id="liEmail" type="email" placeholder="you@company.com" autocomplete="username">
<label>Password</label><input id="liPass" type="password" placeholder="••••••••" autocomplete="current-password">
<button type="button" onclick="doLogin()">Log in</button>
</div>
<div class="auth-err" id="err"></div><div class="auth-ok" id="ok"></div>
<div class="demo">Accounts are created by your Academy administrator. Need access or a password reset? Ask your administrator.</div>
</div>
</main>
<footer class="site-footer sec-footer"><span>© 2026 Dealerfocus Training Academy | All rights reserved.</span></footer>
<script>
document.getElementById('fLogin').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent=m;document.getElementById('ok').style.display='none';}
function showOk(m){var e=document.getElementById('ok');e.style.display='block';e.textContent=m;document.getElementById('err').style.display='none';}
function next(){var q=new URLSearchParams(location.search).get('next');return q||null;}
function go(u){if(DFAuth.gateBlocked()){location.href='about-us.html';return;}var n=next();if(n){location.href=n;return;}location.href=(u.role==='admin')?'admin-dashboard.html':'user-dashboard.html';}
async function doLogin(){var r=await DFAuth.login(document.getElementById('liEmail').value,document.getElementById('liPass').value);if(r.error)showErr(r.error);else{showOk('Logged in. Redirecting…');setTimeout(function(){go(r.user);},400);}}
DFAuth.onReady(function(){var me=DFAuth.current();if(me&&!next())go(me);});
</script>
</body>
</html>
